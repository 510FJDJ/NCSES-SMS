    <!-- 依網址錨點（#tab-xxx）切換頁籤：初始渲染直接改 DOM（須於 tabs.js 初始化前執行，避免閃爍），
         載入後另監聽 hashchange（手動改網址列／瀏覽器上一頁下一頁）；
         同頁點選 header nav 連結時，部分瀏覽器對「同文件錨點導覽」不會可靠觸發 hashchange，
         故另用點擊事件代理直接偵測目標連結並切換，兩者共用同一套切換邏輯避免重複 -->
    <script>
        (function () {
            var validTabs = ['tab-basicForm', 'tab-roll', 'tab-export'];

            var hash = window.location.hash.replace('#', '');
            if (validTabs.indexOf(hash) !== -1) {
                document.querySelectorAll('.tabs-nav[role="tablist"] [role="tab"]').forEach(function (tab) {
                    var selected = tab.id === hash;
                    tab.setAttribute('aria-selected', selected ? 'true' : 'false');
                    tab.tabIndex = selected ? 0 : -1;
                    tab.classList.toggle('is-active', selected);
                });
                document.querySelectorAll('.tabs-panel[role="tabpanel"]').forEach(function (panel) {
                    panel.hidden = panel.getAttribute('aria-labelledby') !== hash;
                });
            }

            function activateTabByHash(targetHash) {
                if (validTabs.indexOf(targetHash) === -1) { return; }
                var tab = document.getElementById(targetHash);
                if (!tab || tab.getAttribute('aria-selected') === 'true') { return; }
                // 借用 tabs.js 已綁定的 click 邏輯（同步 aria-selected/面板顯隱並派送 tabs:activate 事件），避免邏輯重複
                tab.click();
                tab.focus();
            }

            window.addEventListener('hashchange', function () {
                activateTabByHash(window.location.hash.replace('#', ''));
            });

            document.addEventListener('click', function (e) {
                var link = e.target.closest ? e.target.closest('a[href*="reportRollData.html#"]') : null;
                if (!link) { return; }
                var targetHash = link.getAttribute('href').split('#')[1];
                // 延後至下一個事件迴圈執行，確保瀏覽器已完成原生錨點導覽（網址列更新）
                window.setTimeout(function () { activateTabByHash(targetHash); }, 0);
            });
        })();
    </script>

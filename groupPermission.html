                        <p class="page-banner-desc">設定「系統管理群組」在系統各功能模組的操作權限。</p>

                        </div>
                    </div>

                                </div>
                                <ul class="permission-list">

        <p class="permission-action-stats" id="permissionStats" role="status">
            <i class="bi bi-check2-square" aria-hidden="true"></i>已授權 <span id="permissionStatsChecked">0</span>/<span id="permissionStatsTotal">0</span>
        </p>
        <div class="permission-action-buttons">
            <button type="button" class="btn permission-action-cancel" id="permissionCancelBtn">取消</button>
            <button type="button" class="btn btn-primary" id="permissionSaveBtn">
                <i class="bi bi-save" aria-hidden="true"></i>存檔
            </button>
        </div>
    </div>

    <!-- 存檔成功回饋 Modal -->
    <div class="modal fade" id="permissionSaveModal" tabindex="-1" aria-labelledby="permissionSaveModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">

                    <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;" aria-hidden="true"></i>
                    <h2 class="h5 mt-3 mb-0" id="permissionSaveModalLabel">權限設定已儲存</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- 回到頂部 -->
    <button type="button" class="scroll-top-btn" aria-label="回到頁面頂端">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
        <span class="scroll-top-text">回頂端</span>
    </button>

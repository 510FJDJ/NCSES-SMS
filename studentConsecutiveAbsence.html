<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo/logo-uni.png" type="image/png">
    <title>學生連續缺席統計 - 國立彰化特殊教育學校 雲端校務管理系統</title>
    <meta name="description" content="依請假日期區間、班級或姓名查詢學生連續缺席情形，提供清單匯出。">
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="css/all.css">
</head>
<body>
    <!-- 無障礙：跳過導覽列，進入主要內容區 -->
    <a href="#goCenter" class="sr-only focusable" title="跳過導覽列，進入主要內容區">主要內容區</a>

    <!-- 總管理者登入 Header -->
    <div id="header" data-layout="layout/header_AdminLogged.html"></div>

    <main id="goCenter" tabindex="-1">
        <!-- 內頁 Banner：麵包屑＋標題＋CSS 裝飾＋插圖 -->
        <section class="page-banner">
            <!-- 裝飾層（純 CSS 繪製） -->
            <div class="page-banner-deco" aria-hidden="true">
                <span class="page-banner-halfcircle"></span>
                <span class="page-banner-circle"></span>
                <span class="page-banner-dots"></span>
            </div>

            <div class="container">
                <nav class="page-banner-breadcrumb" aria-label="麵包屑導覽">
                    <ol>
                        <li>
                            <a class="breadcrumb-home" href="index_AdminLogged.html" aria-label="首頁">
                                <i class="bi bi-house-door" aria-hidden="true"></i>
                            </a>
                        </li>
                        <li><a href="#">學務管理</a></li>
                        <li aria-current="page">學生連續缺席統計</li>
                    </ol>
                </nav>

                <div class="page-banner-main">
                    <div class="page-banner-text">
                        <h1 class="page-banner-title">學生連續缺席統計</h1>
                        <p class="page-banner-desc">依請假日期區間、班級或姓名查詢學生連續缺席情形，提供清單匯出。</p>
                    </div>
                    <!-- 右側人物插圖（純裝飾） -->
                    <div class="page-banner-visual" aria-hidden="true">
                        <img src="img/hero/login-hero/內頁人物背景.png" alt="">
                    </div>
                </div>
            </div>
        </section>

        <!-- 查詢與資料列表 -->
        <section class="data-section">
            <div class="container">
                <div class="data-card">
                    <!-- 查詢工具列（純前端切版：不接資料，畫面示意用假資料） -->
                    <form class="data-toolbar" action="#" method="get">
                        <div class="data-toolbar-field data-toolbar-field--range">
                            <span class="form-label d-block" id="filterDateLabel">請假日期區間</span>
                            <div class="date-range" role="group" aria-labelledby="filterDateLabel">
                                <label class="sr-only" for="filterDateStart">請假開始日期</label>
                                <input type="date" class="form-control" id="filterDateStart" name="filterDateStart">
                                <span class="date-range-sep" aria-hidden="true">~</span>
                                <label class="sr-only" for="filterDateEnd">請假結束日期</label>
                                <input type="date" class="form-control" id="filterDateEnd" name="filterDateEnd">
                            </div>
                        </div>
                        <div class="data-toolbar-field">
                            <label class="form-label" for="filterClassToggle">班級</label>
                            <!-- 下拉搜尋選單通用元件（比照 teacherSubject.html），後端：選項為系統既有班級清單，動態產生 -->
                            <div class="dropdown dropdown-search" data-dropdown-search>
                                <button class="form-select text-start text-muted bg-white" type="button" id="filterClassToggle" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                                    請選擇
                                </button>
                                <div class="dropdown-menu w-100 p-2" aria-labelledby="filterClassToggle">
                                    <div class="dropdown-search-box">
                                        <label class="sr-only" for="filterClassSearch">搜尋班級名稱</label>
                                        <input type="search" class="form-control" id="filterClassSearch" placeholder="搜尋班級名稱" data-dropdown-search-input autocomplete="off">
                                    </div>
                                    <ul class="dropdown-search-list">
                                        <li><button type="button" class="dropdown-search-item" data-value="1">國小低年級</button></li>
                                        <li><button type="button" class="dropdown-search-item" data-value="2">國小中年級</button></li>
                                        <li><button type="button" class="dropdown-search-item" data-value="3">國中一年級</button></li>
                                        <li><button type="button" class="dropdown-search-item" data-value="4">11年1班</button></li>
                                        <li><button type="button" class="dropdown-search-item" data-value="5">12年1班</button></li>
                                    </ul>
                                    <p class="dropdown-search-empty" data-dropdown-search-empty hidden>查無符合的班級</p>
                                </div>
                                <input type="hidden" name="filterClass" data-dropdown-search-value>
                            </div>
                        </div>
                        <div class="data-toolbar-field">
                            <label class="form-label" for="filterStudentName">姓名</label>
                            <input type="text" class="form-control" id="filterStudentName" name="filterStudentName" placeholder="請輸入姓名">
                        </div>
                        <div class="data-toolbar-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search" aria-hidden="true"></i>查詢
                            </button>
                            <button type="button" class="btn btn-export">
                                <i class="bi bi-download" aria-hidden="true"></i>匯出
                            </button>
                        </div>
                    </form>

                    <!-- 後端：總筆數 -->
                    <p class="data-total">總筆數：4</p>

                    <table class="table data-table table-striped">
                        <caption class="sr-only">學生連續缺席統計列表</caption>
                        <thead>
                            <tr>
                                <th scope="col">
                                    <span class="check-all-label">
                                        <input class="form-check-input" type="checkbox" id="checkAll" data-check-all>
                                        <label for="checkAll">全選</label>
                                    </span>
                                </th>
                                <th scope="col">項次</th>
                                <th scope="col">班級</th>
                                <th scope="col">姓名</th>
                                <th scope="col">起始日期</th>
                                <th scope="col">結束日期</th>
                                <th scope="col">日數</th>
                            </tr>
                        </thead>
                        <!-- 後端：以下列表資料為動態產生，示意 4 筆假資料 -->
                        <tbody>
                            <tr>
                                <td data-label="勾選"><span class="cell-value"><input class="form-check-input" type="checkbox" data-check-row aria-label="選取王小明連續缺席紀錄"></span></td>
                                <td data-label="項次"><span class="cell-value">1</span></td>
                                <td data-label="班級"><span class="cell-value">國小中年級</span></td>
                                <td data-label="姓名"><span class="cell-value">王小明</span></td>
                                <td data-label="起始日期"><span class="cell-value">2025-03-01</span></td>
                                <td data-label="結束日期"><span class="cell-value">2025-03-03</span></td>
                                <td data-label="日數"><span class="cell-value">3</span></td>
                            </tr>
                            <tr>
                                <td data-label="勾選"><span class="cell-value"><input class="form-check-input" type="checkbox" data-check-row aria-label="選取陳小華連續缺席紀錄"></span></td>
                                <td data-label="項次"><span class="cell-value">2</span></td>
                                <td data-label="班級"><span class="cell-value">國中一年級</span></td>
                                <td data-label="姓名"><span class="cell-value">陳小華</span></td>
                                <td data-label="起始日期"><span class="cell-value">2025-03-05</span></td>
                                <td data-label="結束日期"><span class="cell-value">2025-03-07</span></td>
                                <td data-label="日數"><span class="cell-value">3</span></td>
                            </tr>
                            <tr>
                                <td data-label="勾選"><span class="cell-value"><input class="form-check-input" type="checkbox" data-check-row aria-label="選取林小美連續缺席紀錄"></span></td>
                                <td data-label="項次"><span class="cell-value">3</span></td>
                                <td data-label="班級"><span class="cell-value">12年1班</span></td>
                                <td data-label="姓名"><span class="cell-value">林小美</span></td>
                                <td data-label="起始日期"><span class="cell-value">2025-03-10</span></td>
                                <td data-label="結束日期"><span class="cell-value">2025-03-14</span></td>
                                <td data-label="日數"><span class="cell-value">5</span></td>
                            </tr>
                            <tr>
                                <td data-label="勾選"><span class="cell-value"><input class="form-check-input" type="checkbox" data-check-row aria-label="選取張小強連續缺席紀錄"></span></td>
                                <td data-label="項次"><span class="cell-value">4</span></td>
                                <td data-label="班級"><span class="cell-value">國小低年級</span></td>
                                <td data-label="姓名"><span class="cell-value">張小強</span></td>
                                <td data-label="起始日期"><span class="cell-value">2025-03-18</span></td>
                                <td data-label="結束日期"><span class="cell-value">2025-03-20</span></td>
                                <td data-label="日數"><span class="cell-value">3</span></td>
                            </tr>
                        </tbody>
                    </table>

                     <!-- 後端：分頁為動態產生 -->
                    <nav class="data-pagination" aria-label="分頁導覽">
                        <ul class="pagination">
                            <li class="page-item page-item--nav">
                                <a class="page-link" href="#" aria-label="上一頁">
                                    <i class="bi bi-chevron-double-left" aria-hidden="true"></i>
                                </a>
                            </li>
                            <li class="page-item active" aria-current="page"><span class="page-link">1</span></li>
                            <li class="page-item"><a class="page-link" href="#">2</a></li>
                            <li class="page-item page-item--nav">
                                <a class="page-link" href="#" aria-label="下一頁">
                                    <i class="bi bi-chevron-double-right" aria-hidden="true"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </section>
    </main>

    <!-- 回到頂部 -->
    <button type="button" class="scroll-top-btn" aria-label="回到頁面頂端">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
        <span class="scroll-top-text">回頂端</span>
    </button>

    <!-- 共用 Footer -->
    <div id="footer" data-layout="layout/footer.html"></div>

    <!-- 全站腳本（本地端，禁止 CDN） -->
    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo/logo-uni.png" type="image/png">
    <title>個人密碼修改 - 國立彰化特殊教育學校 雲端校務管理系統</title>
    <meta name="description" content="修改您的登入密碼，確保帳號安全。">
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="css/all.css">
</head>
<body>
    <!-- 無障礙：跳過導覽列，進入主要內容區 -->
    <a href="#goCenter" class="sr-only focusable" accesskey="C" title="跳過導覽列，進入主要內容區">主要內容區</a>
    <!-- 無障礙：跳至上方導覽列 -->
    <a href="#headerNav" class="sr-only focusable" accesskey="U" title="跳至上方導覽列">上方導覽列</a>

    <!-- 總管理者登入 Header -->
    <div id="header" data-layout="layout/header_AdminLogged.html"></div>

    <main id="goCenter" tabindex="-1">
        <!-- 內頁 Banner：麵包屑＋標題＋插圖 -->
        <section class="page-banner">
            <!-- 裝飾層（純 CSS 繪製） -->
            <div class="page-banner-deco" aria-hidden="true">
                <span class="page-banner-halfcircle"></span>
                <span class="page-banner-circle"></span>
                <span class="page-banner-dots"></span>
            </div>

            <div class="container">
                <nav class="page-banner-breadcrumb" aria-label="麵包屑導覽">
                    <ol>
                        <li>
                            <a class="breadcrumb-home" href="index_AdminLogged.html" aria-label="首頁">
                                <i class="bi bi-house-door" aria-hidden="true"></i>
                            </a>
                        </li>
                        <li><a href="#">帳號管理</a></li>
                        <li aria-current="page">個人密碼修改</li>
                    </ol>
                </nav>

                <div class="page-banner-main">
                    <div class="page-banner-text">
                        <h1 class="page-banner-title">個人密碼修改</h1>
                        <p class="page-banner-desc">修改您的登入密碼，確保帳號安全。</p>
                    </div>
                    <!-- 右側人物插圖（純裝飾；背景以 CSS 繪製，角色圖可互換） -->
                    <div class="page-banner-visual page-banner-visual--composed page-banner-visual--pointPerson" aria-hidden="true">
                        <span class="banner-visual-blob"></span>
                        <span class="banner-visual-window"></span>
                        <img class="banner-visual-person" src="img/hero/characters/people-front-point.png" alt="">
                    </div>
                </div>
            </div>
        </section>

        <!-- 個人密碼修改表單（內容較少，卡片不佔滿版寬） -->
        <section class="form-section-wrap">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8">
                        <!-- 後端：表單送出目標與驗證由後端接手 -->
                        <form class="form-card" action="#" method="post" novalidate>
                            <section class="form-section" aria-labelledby="secPassword">
                                <h2 class="form-section-title" id="secPassword">
                                    <i class="bi bi-shield-lock" aria-hidden="true"></i>密碼修改
                                </h2>
                                <div class="row g-3">
                                    <!-- 後端：帳號與使用者名稱由後端帶入，僅供顯示，不可編輯 -->
                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="pwAccount">帳號</label>
                                        <input type="text" class="form-control" id="pwAccount" name="pwAccount" value="A1234567" readonly aria-readonly="true">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="pwUsername">使用者名稱</label>
                                        <input type="text" class="form-control" id="pwUsername" name="pwUsername" value="王小明" readonly aria-readonly="true">
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label" for="oldPassword">原密碼<span class="badge-required">必填</span></label>
                                        <div class="input-password-wrap">
                                            <input type="password" class="form-control" id="oldPassword" name="oldPassword" placeholder="請輸入原密碼" required aria-required="true" autocomplete="current-password" aria-describedby="oldPasswordError">
                                            <button type="button" class="toggle-password" data-target="oldPassword" aria-label="顯示密碼">
                                                <i class="bi bi-eye-slash" aria-hidden="true"></i>
                                            </button>
                                        </div>
                                        <!-- 後端：驗證失敗（原密碼錯誤）時顯示此錯誤文字 -->
                                        <div class="invalid-feedback" id="oldPasswordError">請輸入原密碼。</div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="newPassword">新密碼<span class="badge-required">必填</span></label>
                                        <div class="input-password-wrap">
                                            <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="請設定至少 6 個字元，且不可與帳號相同" minlength="6" required aria-required="true" autocomplete="new-password" aria-describedby="newPasswordError">
                                            <button type="button" class="toggle-password" data-target="newPassword" aria-label="顯示密碼">
                                                <i class="bi bi-eye-slash" aria-hidden="true"></i>
                                            </button>
                                        </div>
                                        <div class="invalid-feedback" id="newPasswordError">新密碼需至少 6 個字元，且不可與帳號相同。</div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="confirmPassword">新密碼確認<span class="badge-required">必填</span></label>
                                        <div class="input-password-wrap">
                                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="請再次輸入新密碼" required aria-required="true" autocomplete="new-password" aria-describedby="confirmPasswordError">
                                            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="顯示密碼">
                                                <i class="bi bi-eye-slash" aria-hidden="true"></i>
                                            </button>
                                        </div>
                                        <div class="invalid-feedback" id="confirmPasswordError">請再次輸入新密碼，需與新密碼一致。</div>
                                    </div>
                                </div>
                            </section>

                            <!-- 底部動作 -->
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-key" aria-hidden="true"></i>更改密碼
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 回到頂部 -->
    <button type="button" class="scroll-top-btn" aria-label="回到頁面頂端">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
        <span class="scroll-top-text">回頂端</span>
    </button>

    <!-- 共用 Footer -->
    <div id="footer" data-layout="layout/footer.html"></div>

    <!-- 全站腳本（本地端，禁止 CDN） -->
    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

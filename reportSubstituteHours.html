<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo/logo-uni.png" type="image/png">
    <title>教師代(兼)課時數統計表 - 國立彰化特殊教育學校 雲端校務管理系統</title>
    <meta name="description" content="依部別與日期區間，統計教師代(兼)課時數，提供多種用途之統計表下載。">
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="css/all.css">
</head>
<body>
    <!-- 無障礙：跳過導覽列，進入主要內容區 -->
    <a href="#goCenter" class="sr-only focusable" accesskey="C" title="跳過導覽列，進入主要內容區">主要內容區</a>
    <!-- 無障礙：跳至上方導覽列 -->
    <a href="#headerNav" class="sr-only focusable" accesskey="U" title="跳至上方導覽列">上方導覽列</a>

    <!-- 總管理者登入 Header -->
    <div id="header" data-layout="layout/header_AdminLogged.html"></div>

    <main id="goCenter" tabindex="-1">
        <!-- 內頁 Banner：麵包屑＋標題＋CSS 裝飾＋插圖 -->
        <section class="page-banner">
            <!-- 裝飾層（純 CSS 繪製） -->
            <div class="page-banner-deco" aria-hidden="true">
                <span class="page-banner-halfcircle"></span>
                <span class="page-banner-circle"></span>
                <span class="page-banner-dots"></span>
            </div>

            <div class="container">
                <nav class="page-banner-breadcrumb" aria-label="麵包屑導覽">
                    <ol>
                        <li>
                            <a class="breadcrumb-home" href="index_AdminLogged.html" aria-label="首頁">
                                <i class="bi bi-house-door" aria-hidden="true"></i>
                            </a>
                        </li>
                        <li><a href="#">各式報表列印</a></li>
                        <li><a href="#">代(兼)課相關報表</a></li>
                        <li aria-current="page">教師代(兼)課時數統計表</li>
                    </ol>
                </nav>

                <div class="page-banner-main">
                    <div class="page-banner-text">
                        <h1 class="page-banner-title">教師代(兼)課時數統計表</h1>
                        <p class="page-banner-desc">依部別與日期區間，統計教師代(兼)課時數，提供多種用途之統計表下載。</p>
                    </div>
                    <!-- 右側人物插圖（純裝飾） -->
                    <div class="page-banner-visual page-banner-visual--composed page-banner-visual--walkPerson" aria-hidden="true">
                        <span class="banner-visual-blob"></span>
                        <span class="banner-visual-window"></span>
                        <img class="banner-visual-person" src="img/hero/characters/people-side-walk.png" alt="">
                    </div>
                </div>
            </div>
        </section>

        <!-- 報表篩選區：單一篩選面板（不分頁籤，本報表無依賴德育/學科結算模組） -->
        <section class="data-section">
            <div class="container">
                <div class="data-card">
                    <!-- 後端：查詢/下載行為由後端接手，前端僅示意流程 -->
                    <form class="report-filter-form" action="#" method="get" novalidate id="subHoursFilterPanel">
                        <div class="report-filter-row">
                            <div class="report-filter-field">
                                <label class="form-label flex-row-center" for="subHoursDept">部別<span class="badge-required">必填</span></label>
                                <select class="form-select" id="subHoursDept" name="subHoursDept">
                                    <option value="" selected>請選擇部別</option>
                                    <option value="1">幼兒部</option>
                                    <option value="2">國小部</option>
                                    <option value="3">國中部</option>
                                    <option value="4">高職部</option>
                                </select>
                            </div>
                            <div class="report-filter-field report-filter-field--wide">
                                <span class="form-label flex-row-center" id="subHoursDateRangeLabel">日期區間<span class="badge-required">必填</span></span>
                                <!-- 示意用：結束日期早於起始日期時模擬「查無資料」，觸發下方狀態徽章 -->
                                <div class="date-range" role="group" aria-labelledby="subHoursDateRangeLabel">
                                    <label class="sr-only" for="subHoursDateStart">起始日期</label>
                                    <input type="date" class="form-control" id="subHoursDateStart" name="subHoursDateStart">
                                    <span class="date-range-sep" aria-hidden="true">~</span>
                                    <label class="sr-only" for="subHoursDateEnd">結束日期</label>
                                    <input type="date" class="form-control" id="subHoursDateEnd" name="subHoursDateEnd">
                                </div>
                            </div>
                        </div>

                        <fieldset>
                            <legend class="form-legend">報表類型<span class="badge-required">必填</span></legend>
                            <div class="form-radio-row">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="subHoursReportType" id="subHoursTypeSubFeeRoll" value="subFeeRoll" checked>
                                    <label class="form-check-label" for="subHoursTypeSubFeeRoll">代課鐘點費清冊</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="subHoursReportType" id="subHoursTypeSubFeeRequest" value="subFeeRequest">
                                    <label class="form-check-label" for="subHoursTypeSubFeeRequest">代課鐘點費請示單</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="subHoursReportType" id="subHoursTypeCoTeachFeeRoll" value="coTeachFeeRoll">
                                    <label class="form-check-label" for="subHoursTypeCoTeachFeeRoll">兼課鐘點費清冊</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="subHoursReportType" id="subHoursTypeCoTeachFeeRequest" value="coTeachFeeRequest">
                                    <label class="form-check-label" for="subHoursTypeCoTeachFeeRequest">兼課鐘點費請示單</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="subHoursReportType" id="subHoursTypeSummary" value="subSummary">
                                    <label class="form-check-label" for="subHoursTypeSummary">代課情形統計表</label>
                                </div>
                            </div>
                        </fieldset>

                        <div class="report-status-inline" id="subHoursStatusInline">
                            <span class="report-status-badge" id="subHoursStatusBadge"></span>
                            <span class="report-status-desc" id="subHoursStatusDesc"></span>
                            <a href="#" class="report-status-action" id="subHoursStatusAction" hidden>前往結算</a>
                        </div>

                        <div class="report-filter-actions">
                            <button type="button" class="btn btn-export report-download-btn" data-report-key="substituteHoursReport" id="subHoursDownloadBtn">
                                <i class="bi bi-download" aria-hidden="true"></i>檔案(Excel)下載
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- 回饋 Modal（3 秒倒數自動關閉；圖示/色彩由 JS 依情境切換） -->
    <div class="modal fade feedback-modal" id="feedbackModal" tabindex="-1" aria-labelledby="feedbackModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body feedback-body" role="status">
                    <span class="feedback-icon" aria-hidden="true">
                        <i class="bi bi-file-earmark-check"></i>
                    </span>
                    <h2 class="feedback-title" id="feedbackModalTitle">報表下載成功</h2>
                    <p class="feedback-desc">報表已開始下載，請至瀏覽器下載紀錄查看。</p>
                    <p class="feedback-countdown"><span class="feedback-countdown-num">3</span>秒後 自動關閉</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 手動關閉版回饋 Modal：報表狀態非「可下載」時的提示（內容由 JS 依狀態動態帶入） -->
    <div class="modal fade feedback-modal" id="feedbackManualModal" tabindex="-1" aria-labelledby="feedbackManualModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body feedback-body" role="status">
                    <span class="feedback-icon feedback-icon--danger" aria-hidden="true">
                        <i class="bi bi-x-circle-fill"></i>
                    </span>
                    <h2 class="feedback-title" id="feedbackManualModalTitle">目前無法下載</h2>
                    <p class="feedback-desc" id="feedbackManualModalDesc">來源資料尚未完成結算，請先完成結算後再重新下載。</p>
                    <div class="data-modal-actions">
                        <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">取消</button>
                        <a href="#" class="btn btn-primary" id="feedbackManualModalAction">前往結算</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 回到頂部 -->
    <button type="button" class="scroll-top-btn" aria-label="回到頁面頂端">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
        <span class="scroll-top-text">回頂端</span>
    </button>

    <!-- 共用 Footer -->
    <div id="footer" data-layout="layout/footer.html"></div>

    <!-- 全站腳本（本地端，禁止 CDN） -->
    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/report-dependency-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/dataModal.js"></script>
</body>
</html>

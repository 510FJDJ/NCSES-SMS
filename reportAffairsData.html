                                            <option value="3">國小中年級孝班</option>

                                        <select class="form-select" id="rewardClassStart" name="rewardClassStart">

    <!-- 依網址錨點（#tab-xxx）切換頁籤：初始渲染直接改 DOM（須於 tabs.js 初始化前執行，避免閃爍），
         載入後另監聽 hashchange（手動改網址列／瀏覽器上一頁下一頁）；
         同頁點選 header nav 連結時，部分瀏覽器對「同文件錨點導覽」不會可靠觸發 hashchange，
         故另用點擊事件代理直接偵測目標連結並切換，兩者共用同一套切換邏輯避免重複 -->
    <script>
        (function () {
            var validTabs = ['tab-attendance', 'tab-reward'];

            var hash = window.location.hash.replace('#', '');
            if (validTabs.indexOf(hash) !== -1) {
                document.querySelectorAll('.tabs-nav[role="tablist"] [role="tab"]').forEach(function (tab) {
                    var selected = tab.id === hash;
                    tab.setAttribute('aria-selected', selected ? 'true' : 'false');
                    tab.tabIndex = selected ? 0 : -1;
                    tab.classList.toggle('is-active', selected);
                });
                document.querySelectorAll('.tabs-panel[role="tabpanel"]').forEach(function (panel) {
                    panel.hidden = panel.getAttribute('aria-labelledby') !== hash;
                });
            }

            function activateTabByHash(targetHash) {
                if (validTabs.indexOf(targetHash) === -1) { return; }
                var tab = document.getElementById(targetHash);
                if (!tab || tab.getAttribute('aria-selected') === 'true') { return; }
                // 借用 tabs.js 已綁定的 click 邏輯（同步 aria-selected/面板顯隱並派送 tabs:activate 事件），避免邏輯重複
                tab.click();
                tab.focus();
            }

            window.addEventListener('hashchange', function () {
                activateTabByHash(window.location.hash.replace('#', ''));
            });

            document.addEventListener('click', function (e) {
                var link = e.target.closest ? e.target.closest('a[href*="reportAffairsData.html#"]') : null;
                if (!link) { return; }
                var targetHash = link.getAttribute('href').split('#')[1];
                // 延後至下一個事件迴圈執行，確保瀏覽器已完成原生錨點導覽（網址列更新）
                window.setTimeout(function () { activateTabByHash(targetHash); }, 0);
            });
        })();
    </script>

    <!-- 回饋 Modal（3 秒倒數自動關閉；圖示/色彩由 JS 依情境切換） -->
    <div class="modal fade feedback-modal" id="feedbackModal" tabindex="-1" aria-labelledby="feedbackModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body feedback-body" role="status">
                    <span class="feedback-icon" aria-hidden="true">
                        <i class="bi bi-file-earmark-check"></i>
                    </span>
                    <h2 class="feedback-title" id="feedbackModalTitle">報表下載成功</h2>
                    <p class="feedback-desc">報表已開始下載，請至瀏覽器下載紀錄查看。</p>
                    <p class="feedback-countdown"><span class="feedback-countdown-num">3</span>秒後 自動關閉</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 手動關閉版回饋 Modal：報表狀態非「可下載」時的提示（內容由 JS 依狀態動態帶入） -->
    <div class="modal fade feedback-modal" id="feedbackManualModal" tabindex="-1" aria-labelledby="feedbackManualModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body feedback-body" role="status">
                    <span class="feedback-icon feedback-icon--danger" aria-hidden="true">
                        <i class="bi bi-x-circle-fill"></i>
                    </span>
                    <h2 class="feedback-title" id="feedbackManualModalTitle">目前無法下載</h2>
                    <p class="feedback-desc" id="feedbackManualModalDesc">來源資料尚未完成結算，請先完成結算後再重新下載。</p>
                    <div class="data-modal-actions">
                        <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">取消</button>
                        <a href="#" class="btn btn-primary" id="feedbackManualModalAction">前往結算</a>
                    </div>
                </div>
            </div>
        </div>
